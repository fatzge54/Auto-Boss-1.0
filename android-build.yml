name: Build AUTO BOSS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot project
        run: |
          godot --version
          test -f project.godot
          test -f export_presets.cfg

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/AUTO_BOSS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO_BOSS-Android-APK
          path: build/AUTO_BOSS.apk
          if-no-files-found: error
